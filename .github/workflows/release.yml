name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm.celados.com
    runs-on: celados-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp .npmrc.ci .npmrc
          bun install --frozen-lockfile

      - name: Verify package
        run: bun run verify

      - name: Verify release contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          test "$(bun -p "require('./package.json').name")" = "@celados/ripple-ark"
          test "${{ github.event.release.tag_name }}" = "v$VERSION"
          npm publish --dry-run --access public

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Verify clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bun -p "require('./package.json').version")"
          CONSUMER_DIR="$(mktemp -d)"
          cp .npmrc.ci "$CONSUMER_DIR/.npmrc"
          cd "$CONSUMER_DIR"
          bun init -y
          # TSRX 0.3.x patches TypeScript's compiler entry and does not support the new TS 7 exports map.
          bun add "@celados/ripple-ark@$VERSION" ripple @ripple-ts/vite-plugin @tsrx/typescript-plugin typescript@5 vite
          printf 'import { Accordion } from "@celados/ripple-ark/accordion";\nexport function App() @{\n  <Accordion.Root id="release-check" defaultValue={["first"]}>\n    <Accordion.Item value="first"><Accordion.ItemTrigger>First</Accordion.ItemTrigger><Accordion.ItemContent>Published source</Accordion.ItemContent></Accordion.Item>\n  </Accordion.Root>\n}\n' > index.tsrx
          printf 'import { ripple } from "@ripple-ts/vite-plugin";\nimport { defineConfig } from "vite";\nexport default defineConfig({ build: { rollupOptions: { input: "index.tsrx" } }, plugins: [ripple()] });\n' > vite.config.ts
          printf '{"compilerOptions":{"target":"ESNext","module":"ESNext","moduleResolution":"bundler","jsx":"preserve","jsxImportSource":"ripple","noEmit":true,"skipLibCheck":true},"include":["index.tsrx"]}\n' > tsconfig.json
          bunx tsrx-tsc --noEmit
          bunx vite build
          VERSION="$VERSION" bun -e 'const pkg = await import("@celados/ripple-ark/package.json"); if (pkg.default.version !== process.env.VERSION) process.exit(1); console.log(`${pkg.default.name}@${pkg.default.version} from https://npm.celados.com`)'
